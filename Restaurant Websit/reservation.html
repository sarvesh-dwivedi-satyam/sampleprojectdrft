<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Request a table reservation at Midnight Bistro.">
    <title>Reservations | Midnight Bistro</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css">
    <script src="scripts/site.js" defer></script><script src="scripts/forms.js" defer></script>
</head>
<body>
    <header class="site-header"><a class="brand" href="index.html">Midnight Bistro</a><nav aria-label="Primary navigation"><ul><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a href="login.html">Login</a></li><li><a href="cart.html">Cart <span data-cart-count>0</span></a></li></ul></nav></header>
    <main class="page-main auth-main"><form class="form-panel" data-reservation-form novalidate>
        <p class="eyebrow">A seat is waiting</p><h1>Request a Reservation</h1><p>Requests are subject to availability. A confirmation is returned only after the server accepts your request.</p>
        <label for="guest-name">Full name</label><input id="guest-name" name="guestName" autocomplete="name" required minlength="2" maxlength="120">
        <label for="guest-email">Email address</label><input id="guest-email" name="guestEmail" type="email" autocomplete="email" required maxlength="254">
        <label for="guest-phone">Phone number</label><input id="guest-phone" name="guestPhone" type="tel" autocomplete="tel" required minlength="7" maxlength="30">
        <label for="reservation-date">Date</label><input id="reservation-date" name="date" type="date" required>
        <label for="reservation-time">Time</label><input id="reservation-time" name="time" type="time" required>
        <label for="guest-count">Guests</label><input id="guest-count" name="guestCount" type="number" min="1" max="20" value="2" required>
        <label for="reservation-notes">Notes (optional)</label><textarea id="reservation-notes" name="notes" rows="3" maxlength="1000"></textarea>
        <button class="button button--primary" type="submit">Send Reservation Request</button><p class="notice" data-form-status role="status" aria-live="polite"></p>
    </form></main>
    <footer class="site-footer"><a class="brand" href="index.html">Midnight Bistro</a><p><small>&copy; 2026 Midnight Bistro.</small></p></footer>
</body>
</html>
