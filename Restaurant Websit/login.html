<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to your Midnight Bistro customer account.">
    <title>Login | Midnight Bistro</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css">
    <script src="scripts/site.js" defer></script><script src="scripts/auth.js" defer></script>
</head>
<body>
    <header class="site-header"><a class="brand" href="index.html">Midnight Bistro</a><nav aria-label="Primary navigation"><ul><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a href="login.html" aria-current="page">Login</a></li><li><a href="signup.html">Sign Up</a></li></ul></nav></header>
    <main class="page-main auth-main"><form class="form-panel auth-panel" data-auth-form="login" novalidate>
        <p class="eyebrow">Welcome back</p><h1>Sign In</h1>
        <label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" required maxlength="254">
        <label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="128">
        <label class="checkbox-label"><input name="remember" type="checkbox"> Remember me on this device</label>
        <button class="button button--primary" type="submit">Login</button>
        <p class="notice" data-form-status role="status" aria-live="polite"></p>
        <p><a href="forgot-password.html">Forgot password?</a></p><p>New to Midnight Bistro? <a href="signup.html">Create an account</a></p>
    </form></main>
    <footer class="site-footer"><a class="brand" href="index.html">Midnight Bistro</a><p><small>&copy; 2026 Midnight Bistro.</small></p></footer>
</body>
</html>
