<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Set a new password for your Midnight Bistro account.">
    <title>Set New Password | Midnight Bistro</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="auth.css">
    <script src="scripts/site.js" defer></script><script src="scripts/auth.js" defer></script>
</head>
<body>
    <header class="site-header"><a class="brand" href="index.html">Midnight Bistro</a><nav aria-label="Primary navigation"><ul><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li><li><a href="login.html">Login</a></li></ul></nav></header>
    <main class="page-main auth-main"><form class="form-panel auth-panel" data-auth-form="reset" novalidate>
        <p class="eyebrow">Account assistance</p><h1>Set a New Password</h1>
        <label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
        <label for="new-password-confirm">Confirm new password</label><input id="new-password-confirm" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128">
        <button class="button button--primary" type="submit">Update Password</button><p class="notice" data-form-status role="status" aria-live="polite"></p>
    </form></main>
    <footer class="site-footer"><a class="brand" href="index.html">Midnight Bistro</a><p><small>&copy; 2026 Midnight Bistro.</small></p></footer>
</body>
</html>
