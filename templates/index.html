<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Tvarnip AI Studio | Passport Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-card max-w-lg w-full p-10 rounded-[2.5rem] shadow-2xl text-center">
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-white">Satyam Ji <span class="text-blue-500">AI</span></h1>
            <p class="text-slate-400 mt-2">Professional 6-Passport Photo Automator</p>
        </div>

        <form action="/" method="POST" enctype="multipart/form-data" id="uploadForm" class="space-y-6">
            <label class="group relative flex flex-col items-center justify-center w-full h-56 border-2 border-dashed border-slate-600 rounded-3xl cursor-pointer hover:border-blue-500 hover:bg-slate-800/40 transition-all">
                <div class="flex flex-col items-center justify-center">
                    <svg class="w-14 h-14 mb-4 text-slate-500 group-hover:text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-slate-300 font-medium">Photo Select Karein</p>
                    <p class="text-xs text-slate-500 mt-1 uppercase tracking-tighter">Auto Background Remove + 1mm Border</p>
                </div>
                <input type="file" name="file" class="hidden" onchange="showLoading()" required />
            </label>
            
            <button type="submit" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-blue-900/20">
                Generate Print PDF
            </button>
        </form>

        <div id="loader" class="hidden mt-8">
            <div class="animate-spin h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full mx-auto"></div>
            <p class="text-blue-400 mt-4 font-mono animate-pulse">AI PROCESSING IN PROGRESS...</p>
        </div>

        <div class="mt-12 flex justify-between text-[10px] text-slate-600 font-bold uppercase tracking-widest">
            <span>Fazilnagar Hub</span>
            <span>AGI Dev Suite</span>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById('uploadForm').classList.add('opacity-30', 'pointer-events-none');
            document.getElementById('loader').classList.remove('hidden');
        }
    </script>
</body>
</html>
